<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScanlineDunes - Era Racer</title>
<meta name="description" content="ScanlineDunes makes Era Racer, a race through time across the eras of computer graphics, from Mono and CGA to Ultra, Vector and ASCII.">
<meta name="theme-color" content="#0d0812">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
  :root { --bg:#0d0812; --txt:#f4eee8; --soft:#b9adb3; --dim:#8a7f88; --accent:#ffb347; }
  * { box-sizing: border-box; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; color: var(--txt);
         font: 17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         -webkit-font-smoothing: antialiased;
         /* soft glow taken from the poster's sunset (orange/rose fading to near-black plum) */
         background:
           radial-gradient(120% 60% at 50% 0%, rgba(255,140,60,.20) 0%, rgba(190,60,90,.12) 35%, rgba(13,8,18,0) 70%),
           linear-gradient(180deg, #1a0f1c 0%, var(--bg) 55%) fixed;
         padding: max(32px, env(safe-area-inset-top)) 22px max(32px, env(safe-area-inset-bottom)); }
  a { color: var(--soft); text-decoration: none; }
  a:hover { color: var(--txt); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  .wrap { max-width: 1100px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 32px; }
  .studio { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--soft); }

  main { display: grid; gap: 40px; align-items: center; }
  .poster { margin: 0; justify-self: center; width: 100%; max-width: 520px; }
  .poster img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 4; border-radius: 6px;
                box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 4px 14px rgba(0,0,0,.4); }

  .info { text-align: center; }
  .game { margin: 0 0 12px; font-size: clamp(34px, 9vw, 52px); line-height: 1.1; font-weight: 800; letter-spacing: .02em; }
  .tag { margin: 0 auto 32px; max-width: 26em; font-size: 18px; color: var(--soft); }

  /* ===== App Store spot ===== */
  .store { display: inline-block; padding: 16px 30px; border-radius: 14px; background: #fff; color: #111;
           font-size: 17px; font-weight: 600; text-decoration: none; box-shadow: 0 10px 30px rgba(0,0,0,.35); }

  footer { margin: 64px auto 0; text-align: center; font-size: 14px; color: var(--dim); }
  footer nav { display: flex; flex-wrap: wrap; gap: 10px 28px; justify-content: center; margin-bottom: 14px; }

  @media (min-width: 860px) {
    body { padding-top: 48px; }
    header { margin-bottom: 48px; }
    main { grid-template-columns: minmax(0, 480px) minmax(0, 460px); gap: 80px; justify-content: center; }
    .info { text-align: left; }
    .tag { margin-left: 0; }
        }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="studio">ScanlineDunes</h1>
  </header>

  <main>
    <figure class="poster">
      <img src="assets/era-racer-poster-900.jpg"
           srcset="assets/era-racer-poster-600.jpg 600w, assets/era-racer-poster-900.jpg 900w"
           sizes="(min-width: 860px) 480px, 92vw"
           width="900" height="1200"
           alt="Era Racer box art: a red sports car races a rival along a coastal road at sunset, under the Era Racer logo and the line A Race Through Time.">
    </figure>

    <section class="info">
      <p class="tag">A race through time, across the eras of computer graphics.</p>

      <!-- ===== APP STORE LINK: the ONLY place to change at launch =====
           When Era Racer is live:
           1. Replace the <div class="store"> ... </div> below with:
              <a class="store" href="https://apps.apple.com/app/idXXXXXXXXXX">Download on the App Store</a>
              (paste the real link from App Store Connect > App Information > "View on App Store").
           2. Optional: use Apple's official "Download on the App Store" badge instead of the text,
              saved as assets/app-store-badge.svg and following Apple's badge guidelines
              (do not edit the badge art):
              <a href="https://apps.apple.com/app/idXXXXXXXXXX"><img src="assets/app-store-badge.svg" width="160" height="54" alt="Download on the App Store"></a>
           ================================================================ -->
      <div class="store" id="app-store">Coming soon on the App Store</div>
    </section>
  </main>

  <footer>
    <nav>
      <a href="privacy.html">Era Racer Privacy Policy</a>
      <a href="mailto:support@scanlinedunes.com">support@scanlinedunes.com</a>
    </nav>
    <div>&copy; 2026 ScanlineDunes</div>
  </footer>
</div>
</body>
</html>
